<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horyzont - Odkryj pełen obraz</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Inter"', 'sans-serif'],
                    },
                    colors: {
                        bias: {
                            left: '#ef4444',
                            center: '#94a3b8',
                            right: '#3b82f6',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans antialiased bg-slate-50 min-h-screen flex flex-col relative text-slate-900">

    <div class="flex h-1.5 w-full fixed top-0 z-50">
        <div class="w-1/3 bg-bias-left"></div>
        <div class="w-1/3 bg-bias-center"></div>
        <div class="w-1/3 bg-bias-right"></div>
    </div>

    <!-- Główna zawartość -->
    <main class="flex-grow flex flex-col justify-center items-center px-4 sm:px-6 lg:px-8 text-center py-16 md:py-24">

        <div class="max-w-4xl mx-auto w-full">

            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-blue-50 text-blue-600 text-xs font-semibold tracking-wide mb-8 border border-blue-100">
                <span class="relative flex h-2 w-2">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                </span>
                Nowe podejście do wiadomości
            </div>

            <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight mb-6 text-slate-900">
                Wyjdź ze swojej <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-purple-600">bańki.</span>
            </h1>

            <p class="text-lg md:text-xl text-slate-500 max-w-2xl mx-auto mb-12 leading-relaxed">
                Platforma, która porównuje nagłówki z lewej i prawej strony oraz ze środka spektrum politycznego. Poznaj pełen obraz najważniejszych wydarzeń.
            </p>

            <!-- Strumień artykułów na żywo -->
            <div class="w-full max-w-2xl mx-auto mb-16 relative text-left">
                <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-4 px-2">
                    Ostatnio analizowane
                </div>

                <div id="live-feed-container" class="relative flex flex-col gap-3 h-[380px]">
                    <!-- JS ładuje tutaj nowoczesne karty -->
                </div>
            </div>

            <!-- Call to Action -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <a href="#" class="bg-slate-900 text-white px-8 py-4 rounded-xl text-sm font-semibold hover:bg-slate-800 hover:shadow-lg transition-all duration-300 w-full sm:w-auto">
                    Załóż darmowe konto
                </a>
                <a href="stories/index.html" class="bg-white text-slate-900 border border-slate-200 px-8 py-4 rounded-xl text-sm font-semibold hover:bg-slate-50 hover:border-slate-300 transition-all duration-300 w-full sm:w-auto shadow-sm">
                    Przeglądaj bez logowania
                </a>
            </div>

            <div class="mt-8 text-sm text-slate-500">
                Masz już konto? <a href="#" class="text-slate-900 font-semibold hover:text-blue-600 transition-colors">Zaloguj się</a>
            </div>
        </div>

    </main>

    <script src="../static/js/script.js"></script>
</body>
</html>
